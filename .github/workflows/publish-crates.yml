name: Publish crates

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package everything but do not publish'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: is a registry token configured?
        id: creds
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "CARGO_REGISTRY_TOKEN is not set — dry run only." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Publish order is the dependency order and cannot be parallelised:
      # utils needs core on the index before it will verify, parsers needs both,
      # the CLI needs all three. Modern cargo blocks until each upload is
      # queryable, so no manual sleeps.
      - name: publish
        if: steps.creds.outputs.have == 'true' && github.event.inputs.dry_run != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in jc-rs-core jc-rs-utils jc-rs-parsers jc-rs; do
            if cargo publish -p "$crate"; then
              echo "published $crate"
            else
              # Re-running a release should not fail because one crate is
              # already up at this version.
              if cargo search "$crate" --limit 1 | grep -q "^$crate = \"${GITHUB_REF_NAME#v}\""; then
                echo "$crate is already published at this version — continuing"
              else
                echo "publishing $crate failed"; exit 1
              fi
            fi
          done

      - name: dry run
        if: steps.creds.outputs.have != 'true' || github.event.inputs.dry_run == 'true'
        run: |
          set -euo pipefail
          # Only the root crate can be packaged in full before the first
          # release: `cargo package` resolves the registry even with
          # --no-verify, and the other three depend on jc-rs-core by version.
          cargo package -p jc-rs-core
          for crate in jc-rs-utils jc-rs-parsers jc-rs; do
            cargo package --list -p "$crate" > /dev/null
            echo "$crate manifest ok"
          done
          echo "nothing was uploaded"
