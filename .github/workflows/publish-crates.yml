name: Publish crates

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package everything but do not publish'
        type: boolean
        default: true

# Least privilege. id-token is what makes Trusted Publishing work: it lets the
# job ask GitHub's OIDC provider for a signed statement of who it is, which
# crates.io exchanges for a token that lives ~30 minutes. Nothing long-lived is
# stored anywhere.
permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    # Environment, not for an approval gate, but for the two things that cost
    # nothing: it only accepts `v*` tags, and any secret it needs lives here
    # rather than at repository level, so no other workflow can reach it.
    environment: crates-io
    steps:
      # Third-party actions are pinned to commit SHAs, not tags. A tag can be
      # moved; in a job that can publish under our name, that is the whole farm.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: mint a short-lived crates.io token
        id: auth
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: choose credentials
        id: creds
        if: github.event.inputs.dry_run != 'true'
        env:
          OIDC: ${{ steps.auth.outputs.token }}
          FALLBACK: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$OIDC" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "Using a Trusted Publishing token (expires in ~30 min)." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$FALLBACK" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Falling back to CARGO_REGISTRY_TOKEN. Configure Trusted Publishing on crates.io and delete this secret." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No crates.io credentials; nothing was published." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Publish order is the dependency order and cannot be parallelised: utils
      # needs core on the index before it will verify, parsers needs both, the
      # CLI needs all three. Modern cargo blocks until each upload is queryable,
      # so no manual sleeps.
      - name: publish
        if: github.event.inputs.dry_run != 'true' && steps.creds.outputs.mode != 'none'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # From the manifest, not from GITHUB_REF_NAME: on workflow_dispatch
          # the ref is a branch, and stripping a leading "v" off "master" gives
          # nonsense that silently breaks the already-published check below.
          version=$(cargo metadata --no-deps --format-version 1 \
                    | jq -r '.packages[] | select(.name=="jc-rs") | .version')
          echo "publishing version $version"
          for crate in jc-rs-core jc-rs-utils jc-rs-parsers jc-rs jc-rs-wasm; do
            # Ask the registry directly instead of publishing and interpreting
            # the failure. Re-running a release must not break because one
            # crate is already up, and this is also what makes a manual
            # dispatch a safe end-to-end test of the credentials: nothing is
            # uploaded, the OIDC exchange still happens for real.
            #
            # An earlier version parsed `cargo search` output. It could never
            # match: CARGO_TERM_COLOR=always above wraps the crate name in ANSI
            # escapes, so the anchored pattern silently failed and every re-run
            # died on the first crate.
            if curl -sf -A "jc-rs release (github actions)" \
                 "https://crates.io/api/v1/crates/$crate/$version" \
                 | jq -e '.version.num' > /dev/null 2>&1; then
              echo "$crate $version is already on crates.io, skipping"
              continue
            fi

            # Trusted Publishing can push a new version of an existing crate,
            # but it cannot *create* one: crates.io answers 403 "Trusted
            # Publishing tokens do not support creating new crates". The first
            # publish of a new crate has to be done by a person with an API
            # token. Failing the whole release over that would block the
            # crates that CAN go out, so say it plainly and carry on.
            if ! curl -sf -A "jc-rs release (github actions)" \
                   "https://crates.io/api/v1/crates/$crate" > /dev/null 2>&1; then
              echo "::warning::$crate does not exist on crates.io yet."
              {
                echo "**$crate was not published.** Trusted Publishing cannot create a new crate."
                echo ""
                echo 'Publish it once by hand, then this job takes over:'
                echo ""
                echo '```sh'
                echo "cargo publish -p $crate    # with a personal crates.io token"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            cargo publish -p "$crate"
            echo "published $crate $version"
          done

      - name: dry run
        if: github.event.inputs.dry_run == 'true' || steps.creds.outputs.mode == 'none'
        run: |
          set -euo pipefail
          # `--workspace` verifies the members against each other through a
          # temporary local registry rather than against crates.io, so this
          # holds for a version that is not on the index, which is every
          # version at the moment a release is dry-run. See ci.yml.
          cargo package --workspace --exclude jc-rs-bench
          echo "nothing was uploaded"
