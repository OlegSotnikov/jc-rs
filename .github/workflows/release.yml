name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

# Default for every job: read-only. Only the job that creates the GitHub
# Release gets contents: write, and only the job that pushes an image can see
# the Docker Hub credentials, because they live in a protected environment
# rather than at repository level.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  completions:
    name: shell completions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --release -p jc-rs
      - name: generate
        run: |
          mkdir -p completions
          ./target/release/jc-rs --bash-comp > completions/jc-rs.bash
          ./target/release/jc-rs --zsh-comp  > completions/_jc-rs
          ./target/release/jc-rs --fish-comp > completions/jc-rs.fish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: completions
          path: completions/

  build:
    name: ${{ matrix.target }}
    needs: [completions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, not gnu: the point of this project is a binary that runs in a
          # scratch container and on a box with an older libc than the runner's.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: install cross
        if: matrix.cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p jc-rs
          else
            cargo build --release --target ${{ matrix.target }} -p jc-rs
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: completions
          path: completions

      - name: assemble archive
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          stage="jc-rs-${TAG}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp LICENSE README.md "$stage/"
          cp -r completions "$stage/completions"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/jc-rs.exe" "$stage/"
            7z a "${stage}.zip" "$stage" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/jc-rs" "$stage/"
            # A `jc` alias for anyone who wants existing scripts untouched.
            # Shipped, never installed by default: it would shadow the Python
            # jc in PATH, and that is not this project's call to make.
            cp "target/${{ matrix.target }}/release/jc-rs" "$stage/jc"
            tar czf "${stage}.tar.gz" "$stage"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            jc-rs-*.tar.gz
            jc-rs-*.zip

  release:
    name: publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
      - name: checksums
        run: sha256sum jc-rs-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            jc-rs-*
            SHA256SUMS

  docker:
    name: docker image
    needs: [build]
    runs-on: ubuntu-latest
    # Environment: restricts this to `v*` tags and keeps the Docker Hub
    # credentials scoped to this job rather than the whole repository.
    environment: dockerhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: are Docker Hub credentials configured?
        id: creds
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_TOKEN is not set, skipping the image." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.creds.outputs.have == 'true'
        with:
          pattern: dist-*-unknown-linux-musl
          merge-multiple: true
      - name: lay the binaries out by platform
        if: steps.creds.outputs.have == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # One directory per Docker architecture name, which is what the
          # Dockerfile's ${TARGETARCH} selects.
          while read -r arch target; do
            mkdir -p "binaries/linux/$arch"
            tar xzf "jc-rs-${TAG}-${target}.tar.gz"
            mv "jc-rs-${TAG}-${target}/jc-rs" "binaries/linux/$arch/jc-rs"
            chmod +x "binaries/linux/$arch/jc-rs"
            file "binaries/linux/$arch/jc-rs"
          done <<'ARCHES'
          amd64 x86_64-unknown-linux-musl
          arm64 aarch64-unknown-linux-musl
          ARCHES
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: steps.creds.outputs.have == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.creds.outputs.have == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.creds.outputs.have == 'true'
        with:
          context: .
          file: Dockerfile
          push: true
          # One tag, both architectures, the daemon picks. Cheap here because
          # the binaries are prebuilt and the image has no build steps to
          # emulate.
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true
          tags: |
            appmasterio/jc-rs:${{ github.event.inputs.tag || github.ref_name }}
            appmasterio/jc-rs:latest
      # The Docker Hub overview is the first thing anyone sees; keeping it in
      # the repo means it ships with the image instead of drifting.
      #
      # `continue-on-error` because the stored credential is a push/pull PAT:
      # editing repository metadata needs a wider scope and answers
      # "access denied: insufficient scope". The image must still publish when
      # only its description cannot. Give the `dockerhub` environment a PAT
      # with write access to remove this caveat.
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: steps.creds.outputs.have == 'true'
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: appmasterio/jc-rs
          short-description: "Convert CLI output, file formats and strings to JSON from one static binary, 100% jc-compatible"
          readme-filepath: packaging/docker/README.md

  homebrew:
    name: homebrew tap
    needs: [release]
    runs-on: ubuntu-latest
    # Environment: restricts this to `v*` tags and keeps the tap token scoped
    # to this job rather than the whole repository.
    environment: homebrew
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: is a tap token configured?
        id: creds
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN is not set, skipping the tap update." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.creds.outputs.have == 'true'
        with:
          pattern: dist-*
          merge-multiple: true
      - name: fill in the formula
        if: steps.creds.outputs.have == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sha() { sha256sum "jc-rs-${TAG}-$1.tar.gz" | cut -d" " -f1; }

          sed \
            -e "s/__VERSION__/${version}/g" \
            -e "s/__SHA_DARWIN_ARM64__/$(sha aarch64-apple-darwin)/" \
            -e "s/__SHA_DARWIN_X86_64__/$(sha x86_64-apple-darwin)/" \
            -e "s/__SHA_LINUX_ARM64__/$(sha aarch64-unknown-linux-musl)/" \
            -e "s/__SHA_LINUX_X86_64__/$(sha x86_64-unknown-linux-musl)/" \
            packaging/homebrew/jc-rs.rb.tmpl > jc-rs.rb

          if grep -q "__" jc-rs.rb; then
            echo "a placeholder was left unfilled:" >&2
            grep -n "__" jc-rs.rb >&2
            exit 1
          fi
          cat jc-rs.rb
      - name: push it to the tap
        if: steps.creds.outputs.have == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/OlegSotnikov/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp jc-rs.rb tap/Formula/jc-rs.rb
          cd tap
          git config user.name "jc-rs release"
          git config user.email "noreply@jc-rs.com"
          git add Formula/jc-rs.rb
          # Re-running a release must not fail because the tap is already
          # correct: with the formula unchanged, `git commit` exits non-zero
          # on "nothing to commit" and takes the job red for no reason.
          if git diff --cached --quiet; then
            echo "tap already has this formula, nothing to push"
            echo "The Homebrew tap was already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "jc-rs ${TAG}"
          git push

  npm:
    name: npm package
    needs: [release]
    runs-on: ubuntu-latest
    # Environment: restricts this to `v*` tags. npm knows the environment name
    # too: the trusted publisher is registered against workflow `release.yml`
    # *and* environment `npm`, so a token minted by any other job is rejected.
    environment: npm
    # id-token is what makes Trusted Publishing work, exactly as in
    # publish-crates.yml: the job asks GitHub's OIDC provider for a signed
    # statement of who it is, and npm exchanges that for a short-lived
    # credential. Nothing long-lived is stored.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Node 24 for npm >= 11.5.1, which is the floor for Trusted Publishing:
      # node 22 still ships npm 10.9.x, which has no idea OIDC exists and fails
      # with a plain authentication error.
      #
      # `registry-url` is deliberately NOT set. It makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc
      # unconditionally, and npm treats even an empty token as an attempt to
      # authenticate rather than falling through to OIDC. The failure is
      # `ENEEDAUTH ... need auth`, which points at the wrong subsystem
      # entirely. registry.npmjs.org is npm's default, so the line buys us
      # nothing. For the same reason there is no NODE_AUTH_TOKEN and no
      # NPM_TOKEN anywhere below: setting either would break the OIDC path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "24"
      - name: install wasm-pack
        run: cargo install wasm-pack --locked
      - name: build
        run: wasm-pack build crates/jc-rs-wasm --release --target web --out-name jc-rs
      - name: smoke test the package
        # Runs it, rather than checking that files exist. The difference
        # matters: an earlier version built and typed correctly while every
        # record came back as an empty object.
        run: node crates/jc-rs-wasm/tests/smoke.mjs
      - name: is this version already on npm?
        id: state
        working-directory: crates/jc-rs-wasm/pkg
        run: |
          set -euo pipefail
          # npm ships with node, but assert it rather than trusting the image:
          # the whole job silently degrades to a confusing auth error below the
          # floor, and the version is cheap to check.
          npm_version=$(npm --version)
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version is below 11.5.1; Trusted Publishing needs at least that"
            exit 1
          fi
          echo "npm $npm_version, node $(node --version)"

          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Re-running a release must not fail because the version is already
          # up; npm answers a republish with E403, which reads like a
          # permissions problem and is not one.
          if curl -sf "https://registry.npmjs.org/jc-rs-wasm/$version" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "jc-rs-wasm@$version is already on npm, nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: publish
        if: steps.state.outputs.published == 'false'
        working-directory: crates/jc-rs-wasm/pkg
        # No token: the credential is minted from the OIDC claim above.
        # Provenance is generated automatically on this path, and stating it
        # keeps the intent visible: the attestation is what lets anyone tie
        # this tarball back to the workflow run that built it.
        run: npm publish --access public --provenance
      - name: what to fix if that failed
        if: failure() && steps.state.outputs.published == 'false'
        run: |
          {
            echo "### npm publish failed"
            echo ""
            echo "There is no npm token by design. Publishing uses Trusted Publishing (OIDC)."
            echo "npm reports every failure on this path as \`ENEEDAUTH\` or a 404, which"
            echo "points at authentication regardless of the real cause. Check the trusted"
            echo "publisher at <https://www.npmjs.com/package/jc-rs-wasm/access>:"
            echo ""
            echo "| field | must be |"
            echo "|---|---|"
            echo "| organization or user | \`OlegSotnikov\` |"
            echo "| repository | \`jc-rs\` |"
            echo "| workflow filename | \`release.yml\` |"
            echo "| environment | \`npm\` |"
            echo ""
            echo "Adding \`NPM_TOKEN\` back does not fix this. An authToken in the"
            echo "environment stops npm from attempting OIDC at all."
          } >> "$GITHUB_STEP_SUMMARY"
