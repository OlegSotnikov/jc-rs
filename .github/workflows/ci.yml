name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Nothing in CI needs write access or secrets. A fork's pull_request already
# runs without secrets and with a read-only token; this states it explicitly so
# adding a job cannot quietly widen it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --release --workspace
      - name: smoke test the binary
        shell: bash
        run: |
          printf 'Filesystem      Size  Used Avail Use%% Mounted on\n/dev/sda1        20G  4.7G   15G  25%% /\n' \
            | ./target/release/jc-rs --df -p

  fixtures:
    name: fixtures match jc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      # tests/fixtures/ must stay a verbatim copy of the pinned jc corpus.
      # Editing a fixture to make a parser pass is how a project ends up
      # claiming compatibility it does not have.
      - run: make check-fixtures

  test:
    name: unit tests (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Fails on NEW failures and on known failures that started passing.
      # See ci/known-failures.txt for why the suite is not simply green.
      - run: ./ci/run-tests.sh

  differential:
    name: differential vs jc corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: install the oracle's optional deps
        # jc's xml/yaml/plist parsers need these; without them ~30 fixtures
        # land in oracle_reject instead of being tested.
        run: pip install --quiet xmltodict ruamel.yaml pygments
      - run: cargo build --release -p jc-rs
      - name: run the full corpus
        # Ratchet: the floor is the current rate. Raise it in the same commit
        # that improves it. Never lower it.
        run: python3 tests/differential/validate.py --fail-under 86.0
      - name: publish the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-report
          path: |
            tests/differential/REPORT.md
            tests/differential/report.json
      - name: summary
        if: always()
        run: cat tests/differential/REPORT.md >> "$GITHUB_STEP_SUMMARY"

  package:
    name: crates package cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Catches what only surfaces at publish time: a missing manifest field,
      # or a file the build needs that sits outside its crate directory. Each
      # crate is packaged AND the packaged copy is compiled, which is the part
      # that catches the second case.
      - run: cargo package -p jc-rs-core
      - run: cargo package -p jc-rs-utils
      - run: cargo package -p jc-rs-parsers
      - run: cargo package -p jc-rs
