name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Nothing in CI needs write access or secrets. A fork's pull_request already
# runs without secrets and with a read-only token; this states it explicitly so
# adding a job cannot quietly widen it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --workspace
      - name: smoke test the binary
        shell: bash
        run: |
          printf 'Filesystem      Size  Used Avail Use%% Mounted on\n/dev/sda1        20G  4.7G   15G  25%% /\n' \
            | ./target/release/jc-rs --df -p

  fixtures:
    name: fixtures match jc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # tests/fixtures/ must stay a verbatim copy of the pinned jc corpus.
      # Editing a fixture to make a parser pass is how a project ends up
      # claiming compatibility it does not have.
      - run: make check-fixtures

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # TZ matters: jc's fixtures carry *_epoch fields computed in local time
      # and jc's own runtests.sh pins PST8PDT. Any other zone and a pile of
      # timestamp tests fail for a reason that has nothing to do with the code.
      - run: TZ=PST8PDT cargo test --workspace

  differential:
    name: differential vs jc corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: install the oracle's optional deps
        # jc's xml/yaml/plist parsers need these; without them ~30 fixtures
        # land in oracle_reject instead of being tested.
        run: pip install --quiet xmltodict ruamel.yaml pygments
      - run: cargo build --release -p jc-rs
      - name: run the full corpus
        # Ratchet: the floor is the current rate. Raise it in the same commit
        # that improves it. Never lower it.
        run: python3 tests/differential/validate.py --fail-under 100
      - name: publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-report
          path: |
            tests/differential/REPORT.md
            tests/differential/report.json
      - name: summary
        if: always()
        run: cat tests/differential/REPORT.md >> "$GITHUB_STEP_SUMMARY"

  package:
    name: crates package cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Catches what only surfaces at publish time: a missing manifest field,
      # or a file the build needs that sits outside its crate directory.
      #
      # Each crate is packaged AND the packaged copy compiled, which is what
      # catches a file the build needs sitting outside its crate directory.
      #
      # One command, not five. Packaging a crate individually resolves its
      # siblings against crates.io, so every one of these failed for the whole
      # window between bumping the version and the new version reaching the
      # index, exactly when a release is being cut. `--workspace` instead
      # builds a temporary local registry from the crates it has just packaged
      # and verifies against that, so it holds at a version that has never been
      # published. jc-rs-bench is excluded because it is the only member that
      # is not published and its path dependencies carry no version.
      - run: cargo package --workspace --exclude jc-rs-bench

  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every advisory published against anything jc-rs ships fails the build,
      # the same as a test would. Before this job existed the check ran only
      # when someone remembered to type it, and a release went out depending on
      # `atty`, unmaintained since 2024, and on a quick-xml carrying two
      # denial-of-service advisories. `deny.toml` says what is in scope.
      # cargo-deny is installed rather than taken from
      # EmbarkStudios/cargo-deny-action, whose pinned release bundles its own
      # copy: that copy could not read the advisory database at all, because
      # RustSec now publishes entries scored with CVSS 4.0 and it only
      # understands 3.x. A check that fails on the database rather than on the
      # dependencies teaches people to ignore it.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories

  website:
    name: website builds and audits clean
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # The site is deployed by hand, so nothing else would notice a
      # vulnerable transitive dependency or a build that stopped compiling.
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
