[workspace]
members = [
    "crates/jc-rs-core",
    "crates/jc-rs-utils",
    "crates/jc-rs-parsers",
    "crates/jc-rs",
    "crates/jc-rs-bench",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OlegSotnikov/jc-rs"
homepage = "https://jc-rs.com"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
inventory = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }

# A CLI whose whole pitch is startup time should be built like one. `panic =
# "abort"` also drops the unwind tables, which is most of the binary-size win.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Benchmarks need symbols.
[profile.bench]
inherits = "release"
debug = true
strip = false

# What is left of the bulk allow-list this project inherited. It carried ~80
# clippy lints plus dead_code, unused_imports, unused_variables and unused_mut,
# which between them hid 585 warnings -- including four regexes compiled inside
# loops, fourteen unreachable functions and an entire duplicate parser that was
# never registered. Those are fixed; these three are style, and each line here
# is a debt with a number attached rather than a blanket.
[workspace.lints.clippy]
# 47 sites: `if s.starts_with(p) { &s[n..] }` -> `strip_prefix`. Mechanical, but
# each one needs reading to keep the branch structure honest.
manual_strip = "allow"
# 7 sites: mostly `Vec<(String, Vec<Map<String, Value>>)>` in table parsers.
# Wants type aliases.
type_complexity = "allow"
# 2 sites, both parsers where two input shapes legitimately produce the same
# record and jc writes them out separately too.
if_same_then_else = "allow"
