[package]
name = "jc-rs"
version.workspace = true
edition.workspace = true
description = "jc-rs: convert CLI output, file types, and strings to JSON/YAML (Rust rewrite of jc)"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["json", "cli", "parser", "jc", "yaml"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
name = "jc-rs"
path = "src/main.rs"

# `cargo binstall jc-rs` fetches the release archive instead of building from
# source. The paths mirror what release.yml actually produces: the tag carries
# a `v`, and the binary sits inside a directory named after the archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
jc-rs-core = { path = "../jc-rs-core", version = "0.3.1" }
jc-rs-parsers = { path = "../jc-rs-parsers", version = "0.3.1" }
jc-rs-utils = { path = "../jc-rs-utils", version = "0.3.1" }
serde_json = { workspace = true }
serde_yaml = "0.9"
colored = "2"
dirs = "5"

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
