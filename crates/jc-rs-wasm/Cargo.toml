[package]
name = "jc-rs-wasm"
version.workspace = true
edition.workspace = true
description = "jc-rs as WebAssembly — convert CLI output, file types, and strings to JSON in the browser or Node"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["json", "wasm", "parser", "jc", "cli"]
categories = ["wasm", "parser-implementations"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jc-rs-core = { path = "../jc-rs-core", version = "0.0.0" }
jc-rs-parsers = { path = "../jc-rs-parsers", version = "0.0.0" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
